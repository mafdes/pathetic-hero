<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pathetic Hero — RPG satírico medieval donde el aspirante a héroe fracasa estrepitosamente en las pruebas de admisión del Gremio. Pixel art retro estilo SNES." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pathetic Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background-color: #0d0613;
        overflow: hidden;
        font-family: "Press Start 2P", monospace;
        position: fixed;
        inset: 0;
      }

      #game-container {
        width: 100vw;
        height: 100vh;
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #game-container canvas {
        max-width: 100% !important;
        max-height: 100% !important;
        object-fit: contain;
      }

      /* Pantalla de rotación — solo visible en móvil portrait */
      #rotate-screen {
        display: none;
        position: fixed;
        inset: 0;
        background: #0d0613;
        z-index: 9999;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        font-family: 'Press Start 2P', monospace;
        color: #f0e6d3;
        text-align: center;
        padding: 32px;
      }

      /* hover:none = dispositivo sin ratón = táctil */
      @media (orientation: portrait) and (hover: none) {
        #rotate-screen  { display: flex; }
        #game-container { display: none; }
      }

      #rotate-screen .rotate-title {
        font-size: 14px;
        color: #d4a017;
        line-height: 2;
      }

      #rotate-screen .rotate-subtitle {
        font-size: 10px;
        color: #6a4e8a;
        line-height: 2;
      }

      /* Flecha de rotación animada */
      #rotate-screen .rotate-arrow {
        font-size: 48px;
        animation: spin-cw 2s ease-in-out infinite;
        display: inline-block;
        color: #d4a017;
      }

      @keyframes spin-cw {
        0%   { transform: rotate(0deg); }
        40%  { transform: rotate(90deg); }
        60%  { transform: rotate(90deg); }
        100% { transform: rotate(90deg) scale(1.1); }
      }

      canvas {
        display: block;
        /* image-rendering: pixelated se activará cuando usemos sprites pixel art reales.
           A 960x540 con texto CSS, nearest-neighbor hace los textos ilegibles. */
      }
    </style>
  </head>
  <body>
    <!-- Pantalla de rotación: visible solo en móvil portrait via CSS media query -->
    <div id="rotate-screen">
      <div class="rotate-arrow">&#8635;</div>
      <p class="rotate-title">GIRA EL<br>DISPOSITIVO</p>
      <p class="rotate-subtitle">
        El Gremio de Héroes<br>
        no atiende candidatos<br>
        de lado.<br><br>
        Es una norma.<br>
        Página 347 del reglamento.
      </p>
    </div>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
