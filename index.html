<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Pathetic Hero — RPG satírico medieval donde el aspirante a héroe fracasa estrepitosamente en las pruebas de admisión del Gremio. Pixel art retro estilo SNES." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Pathetic Hero</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background-color: #0d0613;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        font-family: "Press Start 2P", monospace;
      }

      #game-container {
        display: block;
        /* Phaser ScaleManager gestionará el tamaño real */
      }

      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
